<article class="card card-border bg-base-100 shadow-sm motion-safe:transition motion-safe:hover:-translate-y-1 hover:shadow-md">
    {% if project.thumbnail %}
        <figure class="aspect-video">
            <img src="{{ project.thumbnail.url }}" alt="Screenshot of {{ project.title }}"
            class="h-full w-full object-cover" loading="lazy">
        </figure>
    {% endif %}
    
    <div class="card-body">
        <span class="text-xs font-semibold uppercase tracking-wider text-primary">{{ project.category.name }}</span>
        <h3 class="card-title">
            <a href="{{ project.get_absolute_url }}" class="outline-none after:absolute after:inset-0">{{ project.title }}</a>
        </h3>
        <p class="grow text-base-content/80">{{ project.summary }}</p>
        <span class="mt-2 text-sm font-semibold text-primary" aria-hidden="true">View project →</span>
    </div>
</article>
