<footer class="footer footer-horizontal footer-center mt-16 border-t border-base-300 bg-base-200 p-8 text-base-content">
  {% if social_links %}
    <nav class="flex flex-wrap justify-center gap-6">
      {% for link in social_links %}
        <a href="{{ link.url }}" class="link link-hover"{% if link.is_external %} target="_blank" rel="me noopener"{% endif %}>{{ link.platform }}</a>
      {% endfor %}
    </nav>
  {% endif %}
  <aside>
    <p class="text-sm text-base-content/70">© {% now "Y" %} Alex · Built with Django, htmx &amp; daisyUI</p>
  </aside>
  <label class="flex cursor-pointer gap-2">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <circle cx="12" cy="12" r="5" />
      <path
        d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
    </svg>
    <input type="checkbox" class="toggle" data-theme-toggle data-light="fantasy" data-dark="synthwave" aria-label="Dark mode">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </label>
</footer>
